<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkbank · Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../src/editor/editor.css">
<style>
  body{padding:24px}
  .werkbank{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}
  .werkbank h1{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .notiz{background:#fdf8ef;border:1px solid #e8d9b8;border-radius:var(--r);padding:12px;font-size:12.5px;line-height:1.55;margin-bottom:20px}
  @media(max-width:900px){.werkbank{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="max-width:1000px;margin:0 auto">
  <h1>Werkbank · Foto- und Video-Editor</h1>
  <p class="notiz"><b>Das ist nicht das Produkt.</b> Diese Seite lädt <i>nur</i> Modul 1 mit einem
  festen Beispiel-Post — zum Arbeiten am Renderer, ohne dass Dashboard oder KI fertig sein müssen.
  Das Produkt ist <a href="../index.html">../index.html</a>.</p>
</div>
<div class="werkbank">
  <section class="stage" id="mount-stage"></section>
  <section class="panel" id="mount-bedienung"></section>
</div>

<script type="module">
  import { state, setzePost } from "../src/core/state.js";
  import * as editor from "../src/editor/editor.js";
  import { zeichnePost } from "../src/editor/image.js";

  // Fester Beispiel-Post — die Werkbank braucht weder Modul 2 noch Modul 3.
  state.motive = [
    { src: "../assets/motiv-haus.jpg",   label: "Das Haus von außen" },
    { src: "../assets/motiv-arbeit.jpg", label: "Bei der Arbeit" }
  ];
  setzePost({
    kicker: "Navis · Berggasthof",
    head: ["SEIT 1934", "AM SELBEN", "FLECK."],
    key: "SEIT 1934",
    caption: "Seit 1934 am selben Fleck.",
    tags: "#navis #tirol",
    quellen: ["Der Großvater hat das Haus 1934 gebaut."],
    cards: [
      { text: "SEIT 1934",  dur: 0.95, key: true  },
      { text: "AM SELBEN",  dur: 0.95, key: false },
      { text: "FLECK.",     dur: 1.10, key: false }
    ],
    motor: "werkbank"
  });

  editor.aufbauen(document.getElementById("mount-stage"),
                  document.getElementById("mount-bedienung"));
  document.fonts?.ready?.then(() => editor.neuZeichnen());
</script>
</body>
</html>
