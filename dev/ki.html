<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkbank · KI-Assistent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../styles/base.css">
<style>
  body{padding:24px}
  .werkbank{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  h1{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
  .notiz{background:#fdf8ef;border:1px solid #e8d9b8;border-radius:var(--r);padding:12px;font-size:12.5px;line-height:1.55}
  pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;
      font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<div class="werkbank">
  <h1>Werkbank · KI-Assistent</h1>
  <p class="notiz"><b>Das ist nicht das Produkt.</b> Diese Seite lädt <i>nur</i> Modul 3 —
  zum Arbeiten an Anbindung, Prompt und Antwortauswertung, ohne Dashboard und Editor.
  Das Produkt ist <a href="../index.html">../index.html</a>.</p>

  <div class="row">
    <button class="btn" id="btnKey">API-Key hinterlegen</button>
    <button class="btn" id="btnPruefen">Anbieter prüfen</button>
    <button class="btn primary" id="btnFragen">Fragen</button>
    <span class="chip off" id="status">—</span>
  </div>

  <div class="stack">
    <span class="eyebrow">Der Prompt, den Modul 3 verschickt</span>
    <pre id="prompt"></pre>
  </div>
  <div class="stack">
    <span class="eyebrow">Die Antwort</span>
    <pre id="antwort">Noch nichts gefragt.</pre>
  </div>
</div>

<script type="module">
  import { state, on } from "../src/core/state.js";
  import { frage, FEHLERTEXT, keyLesen, keySetzen, pruefen } from "../src/ai/client.js";
  import { promptBauen } from "../src/ai/text.js";
  import { bildHolen } from "../src/core/dom.js";

  const $ = s => document.querySelector(s);
  state.motive = [{ src: "../assets/motiv-haus.jpg", label: "Haus" }];
  $("#prompt").textContent = promptBauen();

  function status() {
    const el = $("#status");
    el.textContent = state.ki.bereit ? "bereit: " + state.ki.anbieter : "kein Anbieter";
    el.className = "chip " + (state.ki.bereit ? "live" : "off");
  }
  on("ki", status);
  pruefen().then(status);

  $("#btnKey").onclick = () => {
    const v = prompt("Mistral API-Key (nur in diesem Browser, nie ins Repo):", keyLesen());
    if (v !== null) { keySetzen(v); status(); }
  };
  $("#btnPruefen").onclick = () => pruefen().then(status);

  $("#btnFragen").onclick = async () => {
    $("#antwort").textContent = "Denkt …";
    try {
      const im = await bildHolen("../assets/motiv-haus.jpg");
      const tmp = document.createElement("canvas");
      tmp.width = im.width; tmp.height = im.height;
      tmp.getContext("2d").drawImage(im, 0, 0);
      const bild = await new Promise(r => tmp.toBlob(r, "image/jpeg", 0.85));
      const d = await frage({ prompt: promptBauen(), bild });
      $("#antwort").textContent = JSON.stringify(d, null, 2);
    } catch (e) {
      $("#antwort").textContent = (FEHLERTEXT[e?.code] || "Fehler") + "\n\n" + JSON.stringify(e, null, 2);
    }
  };
</script>
</body>
</html>
